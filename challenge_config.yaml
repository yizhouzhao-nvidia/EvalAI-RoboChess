# Draft: confirm dates, trial protocol, submission limits, and artifact access before publication.
title: RoboChess Pick-and-Place Benchmark
short_description: Submit pinned model links and inference instructions for local robotic pick-and-place evaluation.
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
category: [Dataset, Environment, Workshop]
leaderboard_description: Ranked by organizer-verified pick-and-place success rate (%), highest first. Self-reported scores are unverified metadata and do not affect ranking.
evaluation_script: evaluation_script.zip
remote_evaluation: true
# Provisional benchmark dates; replace with your approved schedule.
start_date: 2026-01-01 00:00:00
end_date: 2099-12-31 23:59:59
published: false
tags: [robotics, manipulation, robochess, pytorch]
leaderboard:
  - id: 1
    schema:
      labels: ["Pick-and-place success rate (%)"]
      default_order_by: "Pick-and-place success rate (%)"
      metadata:
        "Pick-and-place success rate (%)":
          sort_ascending: false
          description: 100 times successful complete pick-and-place trials divided by all evaluation trials, verified by organizers.
challenge_phases:
  - id: 1
    name: Checkpoint Submission
    description: templates/challenge_phase_1_description.html
    leaderboard_public: true
    is_public: true
    challenge: 1
    is_active: true
    # Pending submissions count toward concurrency; allow room for manual evaluation.
    max_concurrent_submissions_allowed: 50
    allowed_email_ids: []
    disable_logs: false
    is_submission_public: true
    start_date: 2026-01-01 00:00:00
    end_date: 2099-12-31 23:59:59
    test_annotation_file: annotations/pick_place_protocol.json
    codename: pick_place
    max_submissions_per_day: 5
    max_submissions_per_month: 50
    max_submissions: 50
    default_submission_meta_attributes:
      - name: method_name
        is_visible: true
      - name: method_description
        is_visible: true
      - name: project_url
        is_visible: true
      - name: publication_url
        is_visible: true
    submission_meta_attributes:
      - name: Reported success rate (%) - unverified
        description: Optional self-reported percentage (0-100). Does not affect the official ranking.
        type: text
        required: false
      - name: Reported successful trials
        description: Optional number of successful trials in your own evaluation.
        type: text
        required: false
      - name: Reported total trials
        description: Optional number of trials in your own evaluation.
        type: text
        required: false
      - name: Self-evaluation protocol
        description: Describe robot or simulator, task setup, trial count, and success criteria.
        type: text
        required: false
      - name: Model and runtime details
        description: Model URL and revision, code commit, parameter count, precision, memory requirements, and inference entry point.
        type: text
        required: true
    is_restricted_to_select_one_submission: false
    is_partial_submission_evaluation_enabled: false
    allowed_submission_file_types: ".zip"
dataset_splits:
  - id: 1
    name: Organizer Pick-and-Place Evaluation
    codename: pick_place_split
challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 3
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: true
    show_execution_time: false
    show_leaderboard_by_latest_submission: false
